<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ news.title }} — okurmen news</title>

  <style>
    :root{
      --bg: #0b0b0b;
      --paper: #0f0f0f;
      --muted: #a8a8a8;
      --accent: #ffffff;
      --glass: rgba(255,255,255,0.04);
      --radius: 12px;
      font-family: Inter, system-ui, sans-serif;
      color-scheme: dark;
    }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg),#050505);
      color:var(--accent);
      font-size:16px;
      line-height:1.55;
    }
    .container{
      max-width:900px;
      margin:28px auto;
      padding:0 20px;
    }
    .breadcrumb{
      font-size:14px;
      color:var(--muted);
      margin-bottom:16px;
    }
    .breadcrumb a{
      color:var(--muted);
      text-decoration:none;
    }
    .breadcrumb a:hover{
      color:var(--accent);
    }

    .article-box{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      padding:28px;
      border-radius:var(--radius);
      box-shadow:0 8px 30px rgba(0,0,0,0.6);
    }
    h1{
      margin:0;
      font-size:32px;
      line-height:1.2;
    }
    .meta{
      margin-top:12px;
      color:var(--muted);
      font-size:14px;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
    .tag{
      background:rgba(255,255,255,0.05);
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
    }
    .cover{
      width:100%;
      height:420px;
      object-fit:cover;
      margin:22px 0;
      border-radius:var(--radius);
    }
    .content{
      color:var(--accent);
      font-size:18px;
      margin-top:10px;
      line-height:1.65;
    }
    .back-link{
      display:inline-block;
      margin-top:18px;
      color:var(--muted);
      text-decoration:none;
      font-size:14px;
    }
    .back-link:hover{
      color:var(--accent);
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="breadcrumb">
      <a href="/">Главная</a> / <span>{{ news.category.title }}</span>
    </div>

    <article class="article-box">

      <h1>{{ news.title }}</h1>

      <div class="meta">
        <span>Автор: <strong>{{ news.author.full_name|default:"Неизвестно" }}</strong></span>
        <span class="dot"></span>
        <time>{{ news.created_at|date:"d E Y" }}</time>
        <span class="tag">{{ news.category.title }}</span>
      </div>

      {% if news.image %}
      <img class="cover" src="{{ news.image.url }}" alt="{{ news.title }}">
      {% endif %}

      <div class="content">
        {{ news.content|safe }}
      </div>

      <a class="back-link" href="/">← Вернуться на главную</a>

    </article>

  </div>
</body>
</html>
